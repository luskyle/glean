name: glean
description: Glean 收藏助手 —— 把散落的好内容拾进来（收件箱 / 剪贴板 / 素材库）。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理（技术调研选型：Riverpod）
  flutter_riverpod: ^2.6.1
  # 本地存储（drift/SQLite）
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  # 图表（遗忘曲线 / 热力图）
  fl_chart: ^1.1.1
  # 设置 KV 与轻量缓存
  shared_preferences: ^2.5.3
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  # 导出 zip（media + JSON）
  archive: ^4.0.0
  # 云盘同步（B 档）：WebDAV 通道（iCloud 走原生通道）
  webdav_client: ^1.1.0
  # 发音：系统 TTS（iOS AVSpeechSynthesizer / Android / 桌面视引擎）
  flutter_tts: ^4.2.0
  # 打开网页原文（收藏出处回看）
  url_launcher: ^6.3.0
  # 本地素材库：目录/文件选择 + 视频播放（桌面端链接本地素材，不导入）
  file_picker: ^8.1.2
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true