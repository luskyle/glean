name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查（M0 验收：analyze 零问题）
        run: flutter analyze
      - name: 单元与组件测试（M0 验收：test 全绿）
        run: flutter test